name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "Customer App CI"
    uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-flutter.yml@main
    with:
      app_name: delivery-app
      flutter_version: "3.32.8"
      build_target: apk
      build_args: "--debug --dart-define=API_BASE_URL=http://10.0.2.2:8079"
      run_coverage: true
